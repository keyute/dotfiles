onboarding = false

# Follow the host terminal's light/dark appearance, matching the Catppuccin
# flavors _sync_appearance picks for every other tool in ~/.zshrc.
[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui]
agent_panel_sort = "spaces"

# A workspace opens with one tab, and a one-entry tab bar costs a row while
# telling us nothing; the strip returns as soon as a second tab exists.
hide_tab_bar_when_single_tab = true

# Default rows plus dim $org/$repo tags: repo basenames repeat across orgs and
# worktree names across repos, so bare auto-labels are ambiguous. Both tokens
# are custom metadata reported by the _herdr_report_org hook in ~/.zshrc —
# workspace metadata for Space rows (org on top-level repos only; worktree
# children read it from their parent row), pane metadata for Agent rows (org
# always, repo only in worktrees, whose entry title is the worktree name).
# Unreported tokens render empty, which is what makes those conditions work —
# rows themselves cannot vary per entry kind.
[ui.sidebar.spaces]
rows = [["state_icon", "workspace"], [{ token = "$org", dim = true }, "branch", "git_status"]]

[ui.sidebar.agents]
rows = [["state_icon", "workspace", "tab"], [{ token = "$org", dim = true }, { token = "$repo", dim = true }, "agent"]]

# One policy covers new panes, tabs, and workspaces, so it is set for the
# workspace case: the sidebar "+" button resolves cwd here and no keybinding
# can reach it. Panes and tabs get follow-the-cwd back via the explicit --cwd
# in the [[keys.command]] bindings below, which outranks this policy.
[terminal]
new_cwd = "home"

[keys]
new_tab = ""
split_vertical = ""
split_horizontal = ""

# HERDR_ACTIVE_PANE_CWD can't carry "follow the cwd": it resolves the pane's
# OSC 7-reported cwd (zsh emits none) or the root shell's process cwd, which
# stays frozen at the workspace's spawn dir — $HOME here, per new_cwd. So each
# binding queries the socket API instead: `pane get` documents foreground_cwd
# as the cwd of the process controlling the PTY (agent or innermost shell),
# matching the built-in follow policy; plain `cwd` then $HOME are fallbacks.
# HERDR_BIN_PATH and HERDR_ACTIVE_PANE_ID are injected only "when available",
# hence their own fallbacks; an unset pane id degrades to a $HOME tab.
# Splits pass --pane rather than --current: --current needs HERDR_PANE_ID,
# which a server-spawned keybinding command has no calling pane to inherit.
# Omitting --pane falls back to the focused pane, right for a keypress anyway.
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "cwd=$(\"${HERDR_BIN_PATH:-herdr}\" pane get \"${HERDR_ACTIVE_PANE_ID:-}\" 2>/dev/null | jq -r '.result.pane.foreground_cwd // .result.pane.cwd // empty'); \"${HERDR_BIN_PATH:-herdr}\" tab create --cwd \"${cwd:-$HOME}\" --focus"
description = "new tab in current directory"

[[keys.command]]
key = "prefix+v"
type = "shell"
command = "cwd=$(\"${HERDR_BIN_PATH:-herdr}\" pane get \"${HERDR_ACTIVE_PANE_ID:-}\" 2>/dev/null | jq -r '.result.pane.foreground_cwd // .result.pane.cwd // empty'); \"${HERDR_BIN_PATH:-herdr}\" pane split ${HERDR_ACTIVE_PANE_ID:+--pane \"$HERDR_ACTIVE_PANE_ID\"} --direction right --cwd \"${cwd:-$HOME}\" --focus"
description = "split right in current directory"

[[keys.command]]
key = "prefix+minus"
type = "shell"
command = "cwd=$(\"${HERDR_BIN_PATH:-herdr}\" pane get \"${HERDR_ACTIVE_PANE_ID:-}\" 2>/dev/null | jq -r '.result.pane.foreground_cwd // .result.pane.cwd // empty'); \"${HERDR_BIN_PATH:-herdr}\" pane split ${HERDR_ACTIVE_PANE_ID:+--pane \"$HERDR_ACTIVE_PANE_ID\"} --direction down --cwd \"${cwd:-$HOME}\" --focus"
description = "split down in current directory"

# Herdr has no built-in equalize action (upstream discussion #1181); the
# script rebalances the active tab's split ratios over the socket API.
# prefix+plus: the =/+ key mirrors Ghostty's equalize_splits chord, and
# prefix+e is taken by the edit_scrollback default (config check does not
# flag such collisions). Absolute path: keybinding commands run under
# /bin/sh -lc, which may not have ~/.local/bin on PATH.
[[keys.command]]
key = "prefix+plus"
type = "shell"
command = "$HOME/.local/bin/herdr-equalize"
description = "equalize pane sizes"
