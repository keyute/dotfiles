onboarding = false

# Follow the host terminal's light/dark appearance, matching the Catppuccin
# flavors _sync_appearance picks for every other tool in ~/.zshrc.
[theme]
name = "catppuccin"
auto_switch = true
light_name = "catppuccin-latte"
dark_name = "catppuccin"

[ui]
agent_panel_sort = "spaces"

# One policy covers new panes, tabs, and workspaces, so it is set for the
# workspace case: the sidebar "+" button resolves cwd here and no keybinding
# can reach it. Panes and tabs get follow-the-cwd back via the explicit --cwd
# in the [[keys.command]] bindings below, which outranks this policy.
[terminal]
new_cwd = "home"

[keys]
new_tab = ""
split_vertical = ""
split_horizontal = ""

# HERDR_ACTIVE_PANE_ID, HERDR_ACTIVE_PANE_CWD, and HERDR_BIN_PATH are the only
# pane context herdr injects into custom commands, and only "when available", so
# each carries a fallback; a bare $VAR would pass an empty --cwd or --pane.
# Not --current: it resolves HERDR_PANE_ID, which a server-spawned keybinding
# command has no calling pane to inherit, and fails with "--current requires
# HERDR_PANE_ID". Omitting --pane falls back to the focused pane, which is the
# right one for a keypress anyway.
[[keys.command]]
key = "prefix+c"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" tab create --cwd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" --focus"
description = "new tab in current directory"

[[keys.command]]
key = "prefix+v"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane split ${HERDR_ACTIVE_PANE_ID:+--pane \"$HERDR_ACTIVE_PANE_ID\"} --direction right --cwd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" --focus"
description = "split right in current directory"

[[keys.command]]
key = "prefix+minus"
type = "shell"
command = "\"${HERDR_BIN_PATH:-herdr}\" pane split ${HERDR_ACTIVE_PANE_ID:+--pane \"$HERDR_ACTIVE_PANE_ID\"} --direction down --cwd \"${HERDR_ACTIVE_PANE_CWD:-$HOME}\" --focus"
description = "split down in current directory"
