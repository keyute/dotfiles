[appearance]
# Match the other tools' dark Catppuccin flavor.
theme = "catppuccin_mocha"
# Match the other tools' light Catppuccin flavor.
theme_light = "catppuccin_latte"
# Enter terminal mode with one pane click instead of two.
click_to_type = "single"

[appearance.sidebar]
# Keep the session rail to the left of the terminal.
position = "left"

[startup]
# Keep sessions in the daemon after the client exits.
daemon = true
# Fill the workspace instead of starting with a floating terminal.
tiled = true
# Open the first terminal without a separate new-window action.
open_default_window = true
# Send typing to the terminal immediately on startup.
start_in_terminal_mode = true

[workspaces]
# Create an empty workspace's pane natively, preserving cwd and typing mode.
new_window_when_empty = true

[notifications.agent]
# Announce agent events even while their pane has focus.
sound = true
suppress_focused = false

[keybindings]
# Use tmux's prefix and pane/workspace shortcuts.
preset = "tmux"

[keybindings.terminal_mode]
# Leave application Alt+arrow navigation and Alt+P available while typing.
terminal_focus_left = []
terminal_focus_right = []
terminal_focus_up = []
terminal_focus_down = []
terminal_prev_window = ["opt+shift+tab"]

[keybindings.global]
# Leave Ctrl+P history navigation to the application.
command_palette = []

[agents.checkpoints]
# Leave repository checkpoints to the user rather than the multiplexer.
enabled = false
