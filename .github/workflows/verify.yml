name: verify

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1"

permissions: {}

# Keyed on event_name as well as ref so a push cannot cancel the weekly
# full-apply run — they share neither duration nor purpose.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  # docs/, README.md, AGENTS.md, CLAUDE.md and .claude/ are chezmoi-ignored —
  # repo-local only — so a commit touching nothing else cannot change a
  # rendered target. Everything else, this workflow included, runs render.
  changes:
    # schedule and workflow_dispatch have no diff base to resolve.
    if: >-
      github.event_name == 'pull_request' || github.event_name == 'push'
      || github.event_name == 'merge_group'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chezmoi: ${{ steps.filter.outputs.chezmoi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Negated patterns are ignored under the default `some` quantifier,
          # which would leave this filter matching every commit. Added in
          # v4.0.3 — v4.0.2 does not accept it.
          predicate-quantifier: some-with-excludes
          filters: |
            chezmoi:
              - '**'
              - '!docs/**'
              - '!README.md'
              - '!AGENTS.md'
              - '!CLAUDE.md'
              - '!.claude/**'

  # Fast gate on every PR and push to main: headless apply into a scratch home
  # with run scripts and externals excluded. modify_ scripts are not in the
  # `scripts` exclude class, so both harnesses' MCP/merge paths still execute —
  # with 1Password stubbed so no real secret ever reaches a runner.
  render:
    needs: changes
    # Fail open: a skipped (schedule/dispatch) or failed `changes` must still
    # run the render rather than silently pass by skipping it.
    if: always() && needs.changes.outputs.chezmoi != 'false'
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-verify-env

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm

      - name: Install repo npm dependencies
        run: npm ci --ignore-scripts --omit=dev --prefix "$GITHUB_WORKSPACE"

      - name: Apply into scratch home
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/home"
          chezmoi -S "$GITHUB_WORKSPACE" -D "$RUNNER_TEMP/home" apply \
            --exclude scripts,externals --no-tty

      # shellcheck ships on the Ubuntu runner image but not the macOS one, and
      # the macOS-only branches (brew, omlx) are the largest scripts here.
      - name: Install shellcheck
        if: runner.os == 'macOS'
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck

      # execute-template renders for the host OS, so each matrix leg checks its
      # own branch of the templates. The fresh-* jobs actually run these, but
      # only weekly and only down the paths they happen to take.
      - name: Render and check run scripts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          for f in run_*.sh.tmpl; do
            chezmoi -S "$GITHUB_WORKSPACE" execute-template < "$f" > "$out/${f%.tmpl}"
            echo "render ok: $f"
          done
          shellcheck --shell=bash --format=gcc "$out"/run_*.sh

      - name: Assert rendered targets
        run: |
          set -euo pipefail
          home="$RUNNER_TEMP/home"
          jq empty "$home/.claude/settings.json"
          jq empty "$home/.claude.json"
          python3 -c 'import tomllib,sys; tomllib.load(open(sys.argv[1],"rb"))' \
            "$home/.codex/config.toml"
          # Rendered configs point MCP/statusline commands into the source
          # dir's node_modules/.bin; a missing binary renders fine but breaks
          # silently at runtime, so assert existence here.
          #
          # Collect into a checked assignment rather than reading a process
          # substitution: `< <(jq ... | sort)` discards the pipeline's exit
          # status even under pipefail, so a jq failure would leave the loop
          # with nothing to read and the step passing green.
          missing=0
          bins=$(jq -r '.. | objects | ((.command? // empty), (.args[]? // empty))
                        | strings | select(test("node_modules/\\.bin"))' \
                 "$home/.claude.json" "$home/.claude/settings.json" | sort -u)
          while IFS= read -r bin; do
            if [ -n "$bin" ] && [ ! -x "$bin" ]; then
              echo "missing binary: $bin"
              missing=1
            fi
          done <<< "$bins"
          [ "$missing" -eq 0 ]

  # Weekly + on-demand only (no path filters by design): a full fresh-machine
  # apply with scripts and externals included. The point is ordering — a
  # script invoking a binary that no earlier step installed must fail the
  # apply. Manual baseline is git + chezmoi (+ Homebrew on macOS) only:
  # node/npm/jq come from the repo's own run_once bootstrap script, so the
  # apply is validated from bare.
  fresh-macos:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-verify-env

      - name: Disk before
        run: df -h /

      # Real home, everything included: npm deps + Playwright Chromium, full
      # `brew bundle --global` (formulae, casks incl. mactex, omlx service),
      # nvim Lazy restore, omlx model downloads/conversions.
      # `brew bundle cleanup --force` will uninstall runner-preinstalled
      # formulae not in the Brewfile — harmless on an ephemeral VM, just slow.
      - name: Full apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: chezmoi -S "$GITHUB_WORKSPACE" apply --no-tty

      - name: Disk after
        if: always()
        run: df -h /

  fresh-linux:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deliberately unpinned: this job exists to prove a fresh apply still works
    # on whatever Fedora is current. Pinning a release would defeat its purpose
    # and turn a real regression into a silently stale pass. The suppression has
    # to sit on the offending line, not above it.
    container: fedora:latest # zizmor: ignore[unpinned-images]
    timeout-minutes: 90
    steps:
      # Container-only artifacts, present on a real Fedora install: sudo, git,
      # tar/gzip (actions/checkout fallback), dnf5-plugins (`dnf copr` in the
      # dnf-repos script). node/npm/jq are deliberately NOT here — the repo's
      # run_once bootstrap script must provide them.
      - name: Bootstrap
        run: dnf install -y sudo git tar gzip dnf5-plugins

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # After checkout: a local action has to exist on disk to be resolved.
      - uses: ./.github/actions/setup-verify-env
        with:
          bin_dir: /usr/local/bin

      # Real home, everything included: dnf vendor repos + metapac copr +
      # development-tools (before), npm deps, then metapac sync and nvim Lazy
      # restore (after).
      - name: Full apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: chezmoi -S "$GITHUB_WORKSPACE" apply --no-tty

  # One stable check name for branch protection, so the required-checks list
  # does not have to track matrix legs or the conditional fresh-* jobs. It
  # cannot speak for lint.yml — that is a separate workflow, and has to be
  # required alongside this one.
  ci:
    if: always()
    needs: [changes, render, fresh-macos, fresh-linux]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
