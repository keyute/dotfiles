name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # tests/check.sh applies the whole tree headless into a scratch home with run
  # scripts and externals excluded. modify_ scripts still execute, with
  # 1Password stubbed so no real secret reaches a runner. The job id `ci` is the
  # check name a branch ruleset requires.
  ci:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-verify-env

      # shellcheck is not on the macOS runner image.
      - name: Install shellcheck
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck

      # fresh.yml runs these only weekly and only down the paths they take.
      - name: Render and check run scripts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          for f in run_*.sh.tmpl; do
            chezmoi -S "$GITHUB_WORKSPACE" execute-template < "$f" > "$out/${f%.tmpl}"
            echo "render ok: $f"
          done
          shellcheck --shell=bash --format=gcc "$out"/run_*.sh tests/check.sh private_dot_claude/executable_statusline.sh

      - name: Run check
        run: tests/check.sh
