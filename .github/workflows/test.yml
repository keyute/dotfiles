name: Test

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  merge_group:

permissions: {}

concurrency:
  group: ${{ github.ref }}-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  # docs/, README.md and AGENTS.md are chezmoi-ignored —
  # repo-local only — so a commit touching nothing else cannot change a
  # rendered target. docs/decisions.md and AGENTS.md still trigger the run:
  # render.test reads them from source. Everything else, this workflow
  # included, runs render.
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      chezmoi: ${{ steps.filter.outputs.chezmoi }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # merge_group runs diff against merge_group.base_sha, which
          # paths-filter fetches when it isn't local — a fetch that
          # persist-credentials: false leaves unauthenticated. fetch-depth: 0
          # puts the base in the clone so it never fires. Pull requests read
          # the file list from the API and don't need this.
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          # Negated patterns are ignored under the default `some` quantifier,
          # which would leave this filter matching every commit.
          predicate-quantifier: some-with-excludes
          filters: |
            chezmoi:
              - '**'
              - '!docs/pi-*.md'
              - '!docs/agent-authoring.md'
              - '!README.md'

  # Fast gate on every PR and push to main: render.test applies the whole tree
  # headless into a scratch home with run scripts and externals excluded. modify_ scripts are not in the
  # `scripts` exclude class, so both harnesses' MCP/merge paths still execute —
  # with 1Password stubbed so no real secret ever reaches a runner.
  render:
    needs: changes
    if: needs.changes.outputs.chezmoi != 'false'
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-verify-env

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: current
          cache: npm

      - name: Install repo npm dependencies
        run: npm ci --ignore-scripts --prefix "$GITHUB_WORKSPACE"

      # shellcheck and ripgrep are not on the macOS runner image; the live
      # tests below need rg.
      - name: Install shellcheck and ripgrep
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
        run: brew install shellcheck ripgrep

      # fresh.yml runs these only weekly and only down the paths they take.
      - name: Render and check run scripts
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/rendered"
          mkdir -p "$out"
          for f in run_*.sh.tmpl; do
            chezmoi -S "$GITHUB_WORKSPACE" execute-template < "$f" > "$out/${f%.tmpl}"
            echo "render ok: $f"
          done
          # Plain run_*.sh scripts (no template directives) are checked in place.
          shellcheck --shell=bash --format=gcc "$out"/run_*.sh run_*.sh

      # Includes the render test, the roster/stub/pin drift gate. The live SRT
      # tests run only here: they need a host Unix socket the local agent
      # sandbox denies.
      - name: Run pi and render tests
        env:
          PI_WORKFLOW_LIVE_TESTS: "1"
        run: npm run test:pi

  # One stable check name for branch protection, so the required-checks list
  # does not have to track individual jobs.
  ci:
    if: always()
    needs: [changes, render]
    runs-on: ubuntu-latest
    steps:
      - name: Check job results
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
