name: Fresh

# Slow (full fresh-machine apply, casks and model conversions included):
# weekly + manual dispatch only, never per-PR. No path filters by design —
# the point is ordering: a script invoking a binary that no earlier step
# installed must fail the apply. Manual baseline is git + chezmoi (+ Homebrew
# on macOS) only: node/npm/jq come from the repo's own run_once bootstrap
# script, so the apply is validated from bare.
on:
  workflow_dispatch:
  schedule:
    - cron: "17 2 * * 1" # weekly, Monday 02:17 UTC

permissions: {}

concurrency:
  group: fresh-apply
  cancel-in-progress: false

jobs:
  fresh-macos:
    runs-on: macos-latest
    permissions:
      contents: read
    timeout-minutes: 180
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-verify-env

      - name: Disk before
        run: df -h /

      # Real home, everything included: npm deps + Playwright Chromium, full
      # `brew bundle --global` (formulae, casks incl. mactex, omlx service),
      # nvim Lazy restore. The omlx model script only asserts its Hugging Face
      # sources under CI=true: the runner's Metal VM times out inside a 12B
      # conversion, so the fetch/convert path is exercised on real machines.
      # `brew bundle cleanup --force` will uninstall runner-preinstalled
      # formulae not in the Brewfile — harmless on an ephemeral VM, just slow.
      - name: Full apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: chezmoi -S "$GITHUB_WORKSPACE" apply --no-tty

      - name: Disk after
        if: always()
        run: df -h /

  fresh-linux:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    # Deliberately unpinned: this job exists to prove a fresh apply still works
    # on whatever Fedora is current. Pinning a release would defeat its purpose
    # and turn a real regression into a silently stale pass. The suppression has
    # to sit on the offending line, not above it.
    container: fedora:latest # zizmor: ignore[unpinned-images]
    timeout-minutes: 90
    steps:
      # Container-only artifacts, present on a real Fedora install: sudo, git,
      # tar/gzip (actions/checkout fallback), dnf5-plugins (`dnf copr` in the
      # dnf-repos script). node/npm/jq are deliberately NOT here — the repo's
      # run_once bootstrap script must provide them.
      - name: Bootstrap
        run: dnf install -y sudo git tar gzip dnf5-plugins

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # After checkout: a local action has to exist on disk to be resolved.
      - uses: ./.github/actions/setup-verify-env
        with:
          bin_dir: /usr/local/bin

      # Real home, everything included: dnf vendor repos + metapac copr +
      # development-tools (before), npm deps, then metapac sync and nvim Lazy
      # restore (after).
      - name: Full apply
        env:
          GH_TOKEN: ${{ github.token }}
        run: chezmoi -S "$GITHUB_WORKSPACE" apply --no-tty
