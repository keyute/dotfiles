name: Set up verify environment
description: Install chezmoi and a stubbed 1Password CLI onto PATH.

inputs:
  bin_dir:
    description: >-
      Directory to install the chezmoi binary into. Defaults to
      $HOME/.local/bin, which cannot be expressed here because inputs are not
      shell-expanded.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      run: |
        set -euo pipefail
        bin="${{ inputs.bin_dir }}"
        [ -n "$bin" ] || bin="$HOME/.local/bin"
        sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$bin"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Stub 1Password CLI
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/opstub"
        cat > "$RUNNER_TEMP/opstub/op" <<'EOF'
        #!/bin/sh
        # chezmoi probes `op --version` to pick CLI syntax; every read gets a
        # fixed placeholder so no real secret exists on the runner.
        case "$1" in
          --version) echo "2.30.0" ;;
          signin) echo "ci-stub-session" ;;
          account) echo "[]" ;;
          *) printf 'ci-op-stub' ;;
        esac
        EOF
        chmod +x "$RUNNER_TEMP/opstub/op"
        echo "$RUNNER_TEMP/opstub" >> "$GITHUB_PATH"
