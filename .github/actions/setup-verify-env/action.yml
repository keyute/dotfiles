name: Set up verify environment
description: Install chezmoi and a stubbed 1Password CLI onto PATH.

runs:
  using: composite
  steps:
    - name: Install chezmoi
      shell: bash
      run: |
        set -euo pipefail
        bin="$HOME/.local/bin"
        sh -c "$(curl -fsLS get.chezmoi.io)" -- -b "$bin"
        echo "$bin" >> "$GITHUB_PATH"

    - name: Stub 1Password CLI
      shell: bash
      run: |
        set -euo pipefail
        mkdir -p "$RUNNER_TEMP/opstub"
        # Every read gets a fixed placeholder so no real secret exists on the runner.
        printf '#!/bin/sh\nprintf ci-op-stub\n' > "$RUNNER_TEMP/opstub/op"
        chmod +x "$RUNNER_TEMP/opstub/op"
        echo "$RUNNER_TEMP/opstub" >> "$GITHUB_PATH"
