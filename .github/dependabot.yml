version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    # held: docs/decisions.md pin.pi_plugins
    ignore:
      - dependency-name: "pi-subagents"
      - dependency-name: "pi-mcp-adapter"
    groups:
      # pi breaks extension APIs across 0.x minors, so its family moves as one
      # PR of its own; first matching group wins, keeping it out of non-breaking
      pi:
        applies-to: "version-updates"
        patterns:
          - "@earendil-works/*"
          - "pi-*"
          - "catppuccin-pi-theme"
      non-breaking:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
  # Workflow actions are pinned to commit SHAs; this is what keeps them current.
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    groups:
      non-breaking:
        applies-to: "version-updates"
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
