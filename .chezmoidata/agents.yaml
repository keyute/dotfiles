agents:
  claude:
    home: "~/.claude"
    defaults:
      # explicit ID: bare aliases float across CLI releases (observed: `haiku`
      # resolving to sonnet-5); [1m] forces the 1M-context variant
      model: claude-opus-5[1m]
    # subpaths of home denied even to this agent itself (transcripts, credentials,
    # history); the rest of home — notably projects/<proj>/memory — stays readable
    sensitive_subpaths:
      - ".env"
      - ".credentials.json"
      - "history.jsonl"
      - "projects/**/*.jsonl"
      - "shell-snapshots"
      - "todos"
    extras:
      readable_paths:
        - "~/.claude/plugins"
      allowed_read_patterns: []
      writable_paths:
        - "~/.claude/plugins/data"
        - "~/.claude/projects"
      allowed_domains:
        - "*.anthropic.com"
        - "code.claude.com"
    plugins:
      "frontend-design@claude-plugins-official": true
      "claude-security@claude-plugins-official": true
      "gopls-lsp@claude-plugins-official": true
      "typescript-lsp@claude-plugins-official": true
      "pyright-lsp@claude-plugins-official": true
      "lua-lsp@claude-plugins-official": true
    marketplaces: {}
  codex:
    home: "~/.codex"
    defaults:
      model: gpt-5.6-sol
      model_reasoning_effort: medium
      plan_mode_reasoning_effort: high
    sensitive_subpaths:
      - "auth.json"
      - "config.toml"
      - "history.jsonl"
      - "sessions"
      - "log"
    extras:
      allowed_domains:
        - "openai.com"
        - "*.openai.com"
        - "chatgpt.com"
        - "*.chatgpt.com"
    skills:
      # off so browser driving stays on one path, the playwright MCP server
      # (see agent_mcp_servers.playwright)
      "browser:control-in-app-browser": false
# shared subagent definitions rendered for every harness; bodies live in
# .chezmoitemplates/subagents/<name>.md, tier resolves via subagent_tiers
subagents:
  # Explore (Claude) / explorer (Codex) override each harness's built-in explore
  # role — which since Claude Code v2.1.198 (and by default on Codex) inherits the
  # session model — to keep routine read-heavy exploration on the small tier.
  # explore-deep handles broad/cross-subsystem sweeps. Names differ because
  # the built-ins do: Claude's is `Explore`, Codex's is `explorer`.
  Explore:
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only code exploration scoped to a single symbol, file, or known area — locate a definition, find callers, trace one flow. Returns distilled findings (paths, file:line), not raw file dumps. Do NOT use for sweeps spanning multiple files or subsystems — dispatch explore-deep for those. Reads local code only — it has no web access, so upstream changelogs and release notes go to dep-researcher."
  explorer:
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only code exploration scoped to a single symbol, file, or known area — locate a definition, find callers, trace one flow. Returns distilled findings (paths, file:line), not raw file dumps. Do NOT use for sweeps spanning multiple files or subsystems — dispatch explore-deep for those. Reads local code only — it has no web access, so upstream changelogs and release notes go to dep-researcher."
  explore-deep:
    tier: mid
    reasoning_effort: medium
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only exploration for a sweep spanning multiple files or subsystems, tracing a flow across module boundaries, or cross-file reasoning — any exploration broad enough you'd otherwise finish it by reading several files yourself. Returns distilled findings (paths, file:line), not raw file dumps. Prefer over Explore whenever scope is broad or unknown."
  go-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Go code diffs for correctness and idiomatic style before merging."
  python-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Python diffs for correctness, type safety, and idiomatic style before merging."
  ts-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review TS/JS (TypeScript/Node.js) diffs for type safety, async correctness, and idiomatic patterns."
  shell-reviewer:
    # mid, not small: shell/template review is judgment work, where the small
    # tier's documented failure mode (flailing, fabrication) lives
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review shell/dotfile diffs — shell scripts, zsh configs, chezmoi templates — for correctness and safety."
  infra-reviewer:
    # the third high-volume stack after go and ts, and the one diff-reviewer's
    # "no language preset" cannot cover: chart/CRD/GitOps hazards are not
    # inferable from surrounding manifests
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Kubernetes/Helm/ArgoCD manifest diffs — chart values, CRDs, GitOps app definitions — for correctness and upgrade safety before merging."
  diff-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review a changed diff through one assigned lens (correctness, simplify, or tests) in any language without a dedicated reviewer; read-only, cites changed hunks. Dispatched per file group by the review-branch skill."
  log-triager:
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Bash"
    description: "Summarize large log files or stderr dumps into a short diagnosis instead of pasting them into the main context."
  dep-researcher:
    # no Bash: agent_sandbox.network allowlists 16 hosts, and upstream release
    # notes are not among them — WebFetch/WebSearch are harness tools and reach
    # them, a curl would fail confusingly. Codex ignores `tools` entirely.
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Glob, WebSearch, WebFetch, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Research one dependency bump — upstream changelog, breaking changes, migration steps, changed defaults. Dispatched per dependency by the dep-audit skill; returns findings only, never touches the repo."
# explicit model IDs, not aliases: aliases re-resolve across CLI releases and can
# silently land on another tier; the agent-instructions-audit skill live-probes
# these pins, so drift fails loudly there instead
subagent_tiers:
  claude:
    small: claude-haiku-4-5
    mid: claude-sonnet-5
    top: claude-opus-5
  codex:
    small: gpt-5.6-luna
    mid: gpt-5.6-terra
    top: gpt-5.6-sol
agent_sandbox:
  filesystem:
    paths:
      ".env": none
      "~/.ssh": none
      "~/.gnupg": none
      "~/.vault-token": none
      "~/.azure": none
      "~/.kube": none
      "~/.docker": none
      "~/.mc": none
      "~/.talos": none
      "~/.config/1Password": none
      "~/.config/op": none
      "~/.config/gcloud": none
      "~/.config/opentofu": none
      "~/.config/configstore": none
      "~/.local/share/uv/credentials": none
      "~/.claude.json": none
      "~/.zsh_history": none
      "~/.zhistory": none
      "~/.go/bin": read
      "~/.go/pkg/mod": write
      "~/.npm/_cacache": write
      "~/.npm/_logs": write
      "~/.cache/uv": write
    # per-OS paths merged on the matching .chezmoi.os (override base modes); others skipped
    os_paths:
      darwin:
        "/opt/homebrew": read
    resolved_paths:
      # path resolved at chezmoi render time; skipped if `requires` binary absent
      - mode: write
        requires: go
        command: "go env GOCACHE"
  network:
    allow_local_binding: true
    allowed_domains:
      - github.com
      - "*.github.com"
      - githubusercontent.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - npmjs.org
      - "*.npmjs.org"
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - pkg.go.dev
      - developer.mozilla.org
      - stackoverflow.com
      - stackexchange.com
      - "*.stackexchange.com"
      - nodejs.org
      - context7.com
      - "*.context7.com"
agent_mcp_servers:
  # Explicit shared trust: Claude emits an allow rule and Codex emits
  # default_tools_approval_mode = "approve"; omission keeps normal review.

  # scoped to claude: codex must not be handed itself as an MCP server; skipped
  # entirely on machines without the codex binary
  codex:
    command: codex
    args:
      - mcp-server
    auto_approve_tools: true
    requires: codex
    harnesses:
      - claude
  context7:
    package_bin: context7-mcp
    args: []
    auto_approve_tools: true
    env:
      CONTEXT7_API_KEY:
        op: Personal/Context7/api key
  exa:
    package_bin: exa-mcp-server
    args: []
    auto_approve_tools: true
    env:
      EXA_API_KEY:
        op: Personal/Exa/api key
  playwright:
    package_bin: playwright-mcp
    # deliberately NOT auto_approve_tools: its tools that take a caller-chosen
    # filename (snapshot, take_screenshot, evaluate, console_messages,
    # network_request/s) write through a workspace check that is purely lexical
    # (path.resolve + prefix, no realpath), so a workspace symlink reaches any
    # path the user can write. Upstream calls that check "not a secure boundary
    # ... always rely on client-level permissions", and the approval prompt is
    # that boundary — the MCP server runs outside the bash sandbox, so nothing
    # else constrains its writes. No browser flag helps: --isolated only keeps
    # the profile off disk, --headless only drops the UI.
    denied_tools:
      # denied outright rather than left to the prompt: never legitimate here.
      # Executes arbitrary JS in the Playwright *server* process
      # (RCE-equivalent, per its own tool description).
      - browser_run_code_unsafe
      # both take `paths` and hand file contents to a page — the same lexical
      # check, so the same symlink walk, in the exfiltration direction
      - browser_file_upload
      - browser_drop
    args:
      - --browser
      - chromium
      - --headless
      - --isolated
