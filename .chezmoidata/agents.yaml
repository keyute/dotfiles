agents:
  claude:
    home: "~/.claude"
    # lines this harness's own prompt surface already carries; the shared
    # projection skips them
    native_coverage: [call_batching, docs_mcp, user_run_commands, initiative]
    # on-demand docs the shared doc-pointer line names
    docs: "~/.claude/docs"
    defaults:
      # a subagent_tiers key, never a second copy of the pin
      tier: top
      reasoning_effort: high
    # models with no effort knob: the render omits `effort:` for a role whose
    # tier resolves to one. Keyed by model: the property moves with the pin.
    no_effort_models: []
    # subpaths of home denied even to this agent itself (transcripts, credentials,
    # history); the rest of home — notably projects/<proj>/memory — stays readable
    sensitive_subpaths:
      - ".env"
      - ".credentials.json"
      - "history.jsonl"
      - "projects/**/*.jsonl"
      - "shell-snapshots"
      - "todos"
      # IDE lock tokens and bridge spawn state: Claude Code denies these on its
      # own, but listing them here carries them to the bridge's git sandbox
      - "ide"
      - "bridge-spawn"
    extras:
      allowed_domains:
        - "*.anthropic.com"
        - "code.claude.com"
    plugins:
      "frontend-design@claude-plugins-official": true
    # disableBundledSkills stays unset: it also drops the review skills
    # Bundled-skill listing: `off` drops a skill from the model's listing,
    # `user-invocable-only` keeps /name while hiding it from the model.
    skill_overrides:
      claude-in-chrome: "off"
      schedule: "off"
      dataviz: "off"
      design-sync: "off"
      fewer-permission-prompts: "off"
      keybindings-help: "user-invocable-only"
      init: "user-invocable-only"
      simplify: "user-invocable-only"
      code-review: "user-invocable-only"
      update-config: "user-invocable-only"
    # bare names leave the model's tool list, not just block the call
    denied_tools:
      - "DesignSync"
      - "RemoteTrigger"
      - "PushNotification"
      - "Agent(isolation:remote)"
      # Agent-tool aliases with no small/top pin; the frontier pin's alias is
      # rendered from subagent_tiers, so children run only tier pins
      - "Agent(model:haiku)"
      # a speed bump under the never-commit/push rule, not a boundary: prefix
      # rules miss `git -C x commit` and `sh -c` forms
      - "Bash(git push:*)"
      - "Bash(git commit:*)"
  pi:
    home: "~/.pi"
    # lines this harness's own prompt surface already carries; the shared
    # projection skips them
    native_coverage: [specialist_pinning]
    docs: "~/.pi/agent/docs"
    # model tier pi-web-search bills at (the plugin's ~/.pi/agent/web-search.json)
    search_tier: small
    defaults:
      provider: &pi_provider openai-codex
      tier: frontier
      reasoning_effort: high
      # approval classifier: one tier model for both stages; the filter answers
      # every reviewed action, anything but allow is re-judged
      classifier: { tier: top, filter_effort: "off", judge_effort: medium }
      # contextWindow per tier in ~/.pi/agent/models.json; an unlisted tier keeps pi's catalog window
      context_window: { top: 872000, frontier: 872000 }
    sensitive_subpaths:
      - "agent/auth.json"
      - "agent/sessions"
      - "agent/models.json"
      - "agent/mcp.json"
      - "agent/mcp-oauth"
      - "agent/workflow.json"
# shared subagent definitions rendered for every harness; bodies live in
# .chezmoitemplates/subagents/<name>.md. Each harness maps `tier` to a pin in
# subagent_tiers.
subagents:
  # `harnesses` scopes a role (default: all). `tools` binds the Claude render
  # directly and the pi render via translation (pi-roles). `omit_instructions`
  # renders Claude's omitClaudeMd and pi's inheritProjectContext/
  # inheritGlobalContext false. `nests` lets a role launch children.
  # Overrides each harness's built-in exploration role (Claude matches on this
  # exact name).
  Explore:
    tier: small
    effort: low
    readonly: true
    omit_instructions: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only code exploration scoped to a single symbol, file, or known area — locate a definition, find callers, trace one flow. Do NOT use for sweeps spanning multiple files or subsystems — dispatch explore-deep for those. No web access: web and docs questions go to researcher, a dependency bump to dep-researcher."
  explore-deep:
    tier: top
    effort: medium
    readonly: true
    omit_instructions: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only exploration for a sweep spanning multiple files or subsystems, tracing a flow across module boundaries, or cross-file reasoning — any exploration broad enough you'd otherwise finish it by reading several files yourself."
  infra-reviewer:
    tier: top
    effort: medium
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Kubernetes/Helm/ArgoCD manifest diffs — chart values, CRDs, GitOps app definitions — for correctness and upgrade safety before merging."
  diff-reviewer:
    tier: top
    effort: medium
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review a changed diff through one assigned lens (correctness, simplify, or tests) in any language (Kubernetes/Helm/ArgoCD manifests: infra-reviewer); read-only, cites changed hunks. Dispatched per file group by the ship-check skill. Judges the changed lines, not the requirements behind them."
  spec-reviewer:
    # the projection's self-review rule names this role literally; render.test
    # fails on a rename
    tier: top
    effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Judge one finished artifact against the requirements it was built from, in one pass — dispatched for the fresh-eyes self-review before work is called done, not for ordinary diff review. Reports requirements that went unimplemented as readily as defects in what was written; read-only. Reviewing the changed lines under one lens is diff-reviewer's job."
  dep-researcher:
    tier: top
    effort: medium
    readonly: true
    omit_instructions: true
    tools: "Read, Grep, Glob, WebSearch, WebFetch, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Research one dependency bump — upstream changelog, breaking changes, migration steps, changed defaults. Dispatched per dependency by the dep-audit skill; returns findings only, never touches the repo."
  researcher:
    tier: top
    effort: medium
    readonly: true
    omit_instructions: true
    tools: "Read, Grep, Glob, WebSearch, WebFetch, mcp__exa__web_search_exa, mcp__exa__web_fetch_exa, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Answer one bounded research question from the web and library docs — practitioner practice, vendor guidance, a library's documented behaviour — and return sourced findings with URL, date and evidence quality. Not for code exploration (explore-*) or a dependency bump (dep-researcher); never edits."
  implementer:
    tier: top
    effort: medium
    readonly: false
    tools: "Read, Grep, Glob, Bash, Edit, Write"
    description: "Implement one bounded slice of a settled design — pattern-repeat edits and spec'd fixes through substantive implementation inside owned files — against explicit acceptance criteria and a verification command. NOT for exploratory work or an unsettled design; never commits."
  # Overrides Claude Code's built-in of the same name and is pi's managed
  # catch-all: the only role that may launch children.
  general-purpose:
    tier: top
    effort: high
    readonly: false
    nests: true
    tools: "Read, Grep, Glob, Bash, Edit, Write, WebSearch, WebFetch, mcp__*"
    description: "Catch-all for multi-step work that fits no specialist — research plus implementation, or a task that needs its own delegation; prefer a specialist when one fits."
  # Claude only: overrides the built-in planner, which inherits the session model
  Plan:
    harnesses: [claude]
    tier: top
    effort: high
    readonly: true
    # its body's read-the-instructions line is then its only route to them
    omit_instructions: true
    tools: "Read, Grep, Glob, Bash"
    description: "Software architect agent for designing implementation plans. Use this when you need to plan the implementation strategy for a task. Returns step-by-step plans, identifies critical files, and considers architectural trade-offs."
# explicit model IDs, not aliases. `frontier` is the tier no child ever runs.
subagent_tiers:
  claude:
    small: claude-sonnet-5-5
    top: claude-opus-5-5
    # settings.json renders this pin's Agent(model:…) alias deny
    frontier: claude-fable-5-1
  pi:
    small: gpt-6-luna
    # anchored: the Claude->pi review/advice bridge pins this tier
    top: &openai_top gpt-6-sol
    frontier: gpt-6-astra
agent_sandbox:
  filesystem:
    paths:
      ".env": none
      "~/.aws": none
      "~/.netrc": none
      "~/.git-credentials": none
      "~/.npmrc": none
      "~/.ssh": none
      "~/.gnupg": none
      "~/.vault-token": none
      "~/.azure": none
      "~/.kube": none
      "~/.docker": none
      "~/.mc": none
      "~/.talos": none
      "~/.config/1Password": none
      "~/.config/op": none
      "~/.config/gcloud": none
      "~/.config/opentofu": none
      "~/.config/configstore": none
      "~/.local/share/uv/credentials": none
      "~/.claude.json": none
      "~/.zsh_history": none
      "~/.zhistory": none
      "~/.go/pkg/mod": write
      "~/.npm/_cacache": write
      "~/.npm/_logs": write
      "~/Library/Caches/uv": write
      "~/Library/Caches/go-build": write
  network:
    allow_local_binding: true
    allowed_domains:
      - github.com
      - "*.github.com"
      - githubusercontent.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - npmjs.org
      - "*.npmjs.org"
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - pkg.go.dev
      - developer.mozilla.org
      - stackoverflow.com
      - stackexchange.com
      - "*.stackexchange.com"
      - nodejs.org
      - context7.com
      - "*.context7.com"
agent_mcp_servers:
  # auto_approve_tools: Claude emits an allow rule and pi's workflow/policy.mjs
  # allows a read-only call outright; omission keeps normal review.

  # scoped to claude: pi must not be handed itself as an MCP server
  pi:
    script: pi-bridge.mjs
    # the bridge runs the top worker tier at its own effort
    args: ["--reasoning-effort", high, "--model", *openai_top, "--provider", *pi_provider]
    auto_approve_tools: true
    readonly_tools: [review, advise, reply]
    # rostered children lose this server (tool list, or disallowedTools on
    # nesting roles); bare agent(), built-in claude and plugin agents keep it
    driver_only: true
    harnesses:
      - claude
  context7:
    package_bin: context7-mcp
    direct_tools: false
    args: []
    auto_approve_tools: true
    readonly_tools: [resolve-library-id, query-docs]
    env:
      CONTEXT7_API_KEY:
        op: Personal/Context7/api key
  exa:
    package_bin: exa-mcp-server
    direct_tools: false
    args: []
    # pi runs the server inside SRT, so its API host joins that sandbox's allowlist
    domains: [api.exa.ai]
    auto_approve_tools: true
    # crawling_exa is web_fetch_exa's legacy name
    readonly_tools: [web_search_exa, web_fetch_exa, get_code_context_exa, company_research_exa, crawling_exa]
    # these dispatch and bill remote agentic runs; denied so a default flip
    # cannot make them auto-approved
    denied_tools:
      - deep_researcher_start
      - deep_researcher_check
      - agent_run
    env:
      EXA_API_KEY:
        op: Personal/Exa/api key
  playwright:
    readonly_tools: [browser_navigate, browser_navigate_back, browser_snapshot, browser_tabs, browser_wait_for]
    package_bin: playwright-mcp
    # not auto_approve_tools: tools taking a caller-chosen filename (snapshot,
    # take_screenshot, evaluate, console_messages, network_request/s) write
    # anywhere under the workspace or output dir, navigate reaches any host, and
    # the server runs outside the bash sandbox
    unsandboxed: true
    denied_tools:
      # executes arbitrary JS in the Playwright *server* process
      - browser_run_code_unsafe
      # both take `paths` and hand local file contents to a page: exfiltration
      # to whatever host the browser is on
      - browser_file_upload
      - browser_drop
    args:
      - --browser
      - chromium
      - --headless
      - --isolated
      # auto-named snapshots and logs land here, not in the session cwd
      - --output-dir
      - /tmp/claude/playwright-mcp
