agents:
  claude:
    home: "~/.claude"
    defaults:
      # a subagent_tiers key, never a second copy of the pin
      tier: top
      reasoning_effort: high
    # subpaths of home denied even to this agent itself (transcripts, credentials,
    # history); the rest of home — notably projects/<proj>/memory — stays readable
    sensitive_subpaths:
      - ".env"
      - ".credentials.json"
      - "history.jsonl"
      - "projects/**/*.jsonl"
      - "shell-snapshots"
      - "backups"
      - "sessions"
      - "paste-cache"
      # IDE lock tokens and Remote Control spawn state: Claude Code's Bash
      # sandbox denies these on its own; this carries them to its file tools
      - "ide"
      - "bridge-spawn"
    plugins:
      "frontend-design@claude-plugins-official": true
    # disableBundledSkills stays unset: it also drops the review skills
    skill_overrides:
      claude-in-chrome: "off"
      schedule: "off"
      dataviz: "off"
      fewer-permission-prompts: "off"
      commit: "off"
      pr: "off"
      keybindings-help: "off"
      init: "user-invocable-only"
      simplify: "user-invocable-only"
      code-review: "user-invocable-only"
      update-config: "user-invocable-only"
    # bare names leave the model's tool list, not just block the call
    denied_tools:
      - "DesignSync"
      - "RemoteTrigger"
      - "Agent(isolation:remote)"
      # a speed bump under the never-commit/push rule, not a boundary: prefix
      # rules miss `git -C x commit` and `sh -c` forms
      - "Bash(git push:*)"
      - "Bash(git commit:*)"
      - "Bash(wt merge:*)"
      - "Bash(wt step commit:*)"
      - "Bash(wt step squash:*)"
  kopi:
    home: "~/.kopi"
    defaults:
      provider: openai-codex
      # a subagent_tiers key, never a second copy of the pin
      tier: top
    # kopi refuses its whole home to its own tools and Bash
    sensitive_subpaths: []
# shared subagent definitions rendered for every harness; bodies live in
# .chezmoitemplates/subagents/<name>.md. Each harness maps `tier` to a pin in
# subagent_tiers.
subagents:
  # `tools` binds the Claude render directly and kopi's as a YAML list; omitting
  # it grants every tool (on Claude that includes Agent, so the role can launch
  # children). `omit_instructions` renders Claude's omitClaudeMd and kopi's
  # `instructions: false`. `readonly` renders kopi's `mode: plan`.
  # `effort` is optional: a role sets it only where a miss is costly, the rest
  # run at `subagent_effort`.
  # Overrides each harness's built-in exploration role (Claude matches on this
  # exact name; kopi has no built-ins and renders role names lowercase).
  Explore:
    tier: small
    effort: high
    readonly: true
    omit_instructions: true
    tools: "Read, Bash"
    description: "Read-only bounded lookup or known-area flow trace, including directly related files. Use explore-deep for broad or cross-subsystem investigation."
  explore-deep:
    tier: top
    readonly: true
    omit_instructions: true
    tools: "Read, Bash"
    description: "Read-only broad or cross-subsystem investigation."
  infra-reviewer:
    tier: top
    readonly: true
    tools: "Read, Bash"
    description: "Review Kubernetes/Helm/ArgoCD manifest diffs — chart values, CRDs, GitOps app definitions — for correctness and upgrade safety before merging."
  diff-reviewer:
    tier: top
    readonly: true
    tools: "Read, Bash"
    description: "Review a changed diff through one assigned lens (correctness, simplify, or tests) in any language (Kubernetes/Helm/ArgoCD manifests: infra-reviewer); read-only, cites changed hunks. Dispatched per file group by the ship-check skill. Judges the changed lines, not the requirements behind them."
  spec-reviewer:
    # the projection's self-review rule names this role literally: rename both together
    tier: top
    effort: high
    readonly: true
    tools: "Read, Bash"
    description: "Judge one finished artifact against the requirements it was built from, in one pass — dispatched for the fresh-eyes self-review before work is called done, not for ordinary diff review. Reports requirements that went unimplemented as readily as defects in what was written; read-only."
  dep-researcher:
    tier: top
    readonly: true
    omit_instructions: true
    # no Bash: an off-list host costs a reviewed per-command allowance there,
    # while the fetch tools reach it unreviewed
    tools: "Read, WebSearch, WebFetch, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Research one dependency bump — upstream changelog, breaking changes, migration steps, changed defaults. Dispatched per dependency by the dep-audit skill; returns findings only, never edits."
  researcher:
    tier: top
    readonly: true
    omit_instructions: true
    # no Bash: an off-list host costs a reviewed per-command allowance there,
    # while the fetch tools reach it unreviewed
    tools: "Read, WebSearch, WebFetch, mcp__exa__web_search_exa, mcp__exa__web_fetch_exa, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Answer one bounded research question from the web and library docs — practitioner practice, vendor guidance, a library's documented behaviour — and return sourced findings with URL, date and evidence quality. Not for code exploration (explore-*) or a dependency bump (dep-researcher); never edits."
  implementer:
    tier: mid
    readonly: false
    tools: "Read, Bash, Edit, Write"
    description: "Implement one bounded slice of a settled design — pattern-repeat edits and spec'd fixes through substantive implementation inside owned files — against explicit acceptance criteria and a verification command. NOT for exploratory work or an unsettled design; never commits."
  # Overrides Claude Code's built-in of the same name; the one role with no
  # tools list, so on Claude it may launch children.
  general-purpose:
    tier: top
    effort: high
    readonly: false
    description: "Catch-all for multi-step work that fits no specialist — research plus implementation, or a task that needs its own delegation; prefer a specialist when one fits."
# explicit model IDs, not aliases. `frontier` is the escalation driver and no
# role runs on it: start a fresh session on it rather than `/model` a grown one,
# since each model has its own cache. A model release replaces an ID here and
# nothing else.
subagent_tiers:
  claude:
    small: claude-haiku-5-5
    mid: claude-sonnet-5-5
    top: claude-opus-5-5
    # settings.json renders this pin's Agent(model:…) alias deny
    frontier: claude-fable-5-2
  kopi:
    small: gpt-6-luna
    mid: gpt-6.1-terra
    top: gpt-6.1-sol
# effort of every role that sets none
subagent_effort: medium
agent_sandbox:
  filesystem:
    paths:
      ".env": none
      ".env.local": none
      "~/.aws": none
      "~/.netrc": none
      "~/.git-credentials": none
      "~/.npmrc": none
      "~/.ssh": none
      "~/.gnupg": none
      "~/.vault-token": none
      "~/.azure": none
      "~/.kube": none
      "~/.docker": none
      "~/.mc": none
      "~/.talos": none
      "~/.config/1Password": none
      "~/.config/op": none
      "~/.config/gcloud": none
      "~/.config/opentofu": none
      "~/.config/configstore": none
      "~/.local/share/uv/credentials": none
      "~/.claude.json": none
      "~/.zsh_history": none
      "~/.zhistory": none
      "~/.python_history": none
      "~/.go/pkg/mod": write
      "~/.npm/_cacache": write
      "~/Library/Caches/uv": write
      "~/Library/Caches/go-build": write
  network:
    # binds and listens on all interfaces, and reaches every localhost port
    allow_local_binding: true
    allowed_domains:
      - github.com
      - "*.github.com"
      - "*.githubusercontent.com"
      - "*.npmjs.org"
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - nodejs.org
agent_mcp_servers:
  # A server is hosted (`url`, with `bearer_op` the 1Password ref whose value
  # becomes its Authorization bearer at apply) or local stdio (`command`, `args`).
  # auto_approve: Claude and kopi emit an allow rule per listed tool; a tool
  # left out, or a server without the key, keeps normal review.
  context7:
    url: https://mcp.context7.com/mcp
    bearer_op: Personal/Context7/api key
    auto_approve: [resolve-library-id, query-docs]
  exa:
    url: https://mcp.exa.ai/mcp
    bearer_op: Personal/Exa/api key
    auto_approve: [web_search_exa, web_fetch_exa]
  playwright:
    # the Homebrew formula (dot_Brewfile); run_onchange_after_playwright-browser
    # installs the Chromium build each release pins
    command: /opt/homebrew/bin/playwright-mcp
    # no auto_approve: tools taking a caller-chosen filename (snapshot,
    # take_screenshot, evaluate, console_messages, network_request/s) write
    # anywhere under the workspace or output dir, navigate reaches any host, and
    # the server runs outside the bash sandbox
    denied_tools:
      # executes arbitrary JS in the Playwright *server* process
      - browser_run_code_unsafe
      # both take `paths` and hand local file contents to a page: exfiltration
      # to whatever host the browser is on
      - browser_file_upload
      - browser_drop
    args:
      - --browser
      - chromium
      - --headless
      - --no-webmcp
      - --isolated
      # no "Ran Playwright code" section in tool results
      - --codegen
      - none
      # auto-named snapshots and logs land here, not in the session cwd
      - --output-dir
      - ~/Library/Caches/playwright-mcp
