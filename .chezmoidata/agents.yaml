# `audit` per harness is what the agent-instructions-audit skill iterates: where
# the consumer template and on-demand docs live in this repo, where the session
# store is and which record shape it has, and how native coverage is probed. A
# new harness is one block here plus (if new) a shape paragraph in the skill.
agents:
  claude:
    home: "~/.claude"
    audit:
      instructions: private_dot_claude/CLAUDE.md.tmpl
      docs: private_dot_claude/docs
      sessions: { path: "~/.claude/projects/**/*.jsonl", shape: claude-projects }
      probe: session+pin
    # rules this harness carries natively; the shared template skips them.
    # Recomputed by the audit skill; evidence lives in the audit log.
    native_coverage: [call_batching, docs_mcp, initiative]
    defaults:
      # Explicit ID: aliases float across releases; [1m] selects the context variant.
      model: claude-fable-5-1[1m]
    # subpaths of home denied even to this agent itself (transcripts, credentials,
    # history); the rest of home — notably projects/<proj>/memory — stays readable
    sensitive_subpaths:
      - ".env"
      - ".credentials.json"
      - "history.jsonl"
      - "projects/**/*.jsonl"
      - "shell-snapshots"
      - "todos"
    extras:
      readable_paths:
        - "~/.claude/plugins"
      allowed_read_patterns: []
      writable_paths:
        - "~/.claude/plugins/data"
        - "~/.claude/projects"
      allowed_domains:
        - "*.anthropic.com"
        - "code.claude.com"
    # LSP plugins dropped 2026-09-13: nvim owns its servers through mason, so
    # these duplicated system packages on two platforms for session-only gain —
    # the same call pi made 2026-09-06. Revisit only on measured pain; project
    # toolchains via Bash already surface diagnostics. claude-security dropped
    # the same day (unwanted); native security-review and codex-review remain.
    plugins:
      "frontend-design@claude-plugins-official": true
    marketplaces: {}
    # Local-only CLI (decision 2026-09-21): claude.ai-product surface is off —
    # settings.json.tmpl stops account skill/plugin sync and drops the cloud
    # tools; these bundled skills and denied tools leave the model's listing.
    # Reverse per entry once one is wanted in the CLI.
    skill_overrides:
      claude-in-chrome: "off"
      schedule: "off"
      loop: "off"
      dataviz: "off"
      # feature-gated; pairs with the DesignSync tool denied below
      design-sync: "off"
    # bare names leave the model's tool list, not just block the call
    denied_tools:
      - "DesignSync"
      - "RemoteTrigger"
      - "PushNotification"
      - "Agent(isolation:remote)"
  codex:
    home: "~/.codex"
    audit:
      instructions: private_dot_codex/AGENTS.md.tmpl
      docs: private_dot_codex/docs
      sessions: { path: "~/.codex/sessions/*/*/*/rollout-*.jsonl", shape: codex-rollout }
      probe: mcp
    native_coverage: []
    defaults:
      # frontier driver (decision 2026-09-15); `review_model` and `[agents]
      # default_subagent_model` render from subagent_tiers.codex.top so /review
      # and unpinned children run the top worker tier. Defaults, not guarantees:
      # the harness prompt prefers the inherited parent model unless AGENTS.md
      # asks otherwise (it does) and openai/codex#32587 can void pins — verify.
      model: gpt-6-astra
      model_reasoning_effort: &codex_reasoning_effort high
      plan_mode_reasoning_effort: high
    sensitive_subpaths:
      - "auth.json"
      - "config.toml"
      - "history.jsonl"
      - "sessions"
      - "log"
    extras:
      allowed_domains:
        - "openai.com"
        - "*.openai.com"
        - "chatgpt.com"
        - "*.chatgpt.com"
    skills:
      # off so browser driving stays on one path, the playwright MCP server
      # (see agent_mcp_servers.playwright)
      "browser:control-in-app-browser": false
  # Pi runs natively so OpenAI subscription authentication remains host-owned.
  # A managed per-tool policy extension constrains model-invoked work; Pi's
  # authentication and session state remain unmanaged.
  pi:
    home: "~/.pi"
    audit:
      instructions: private_dot_pi/agent/AGENTS.md.tmpl
      docs: private_dot_pi/agent/docs
      sessions: { path: "~/.pi/agent/sessions/*/*.jsonl", shape: pi-session }
      # pi's system prompt is static: coverage is read from these files, no live call
      probe: static
      prompt_sources:
        - node_modules/@earendil-works/pi-coding-agent/dist/core/system-prompt.js
        - private_dot_pi/agent/workflow/index.mjs
        - private_dot_pi/agent/subagent-tool-description.md.tmpl
    native_coverage: []
    # composer prefix that runs a command I typed and feeds its output to the
    # model; set only where the harness prompt does not already teach it
    # (Claude's does). pi runs it on the host outside the sandbox, output
    # captured, no TTY.
    # Codex: unset until its prefix's context behaviour is documented.
    user_shell_prefix: "!"
    # pi-web-search: OpenAI's server-side web_search tool through the same
    # Codex Responses endpoint and token as model calls; search_model keeps it
    # off the default model's quota (the plugin's ~/.pi/agent/web-search.json).
    native_web_search: true
    search_tier: small
    agents_dir: "~/.pi/agent/agents"
    defaults:
      provider: openai-codex
      model: gpt-6-astra
      reasoning_effort: high
      plan_reasoning_effort: high
      # Approval classifier in Anthropic's two-stage shape: the filter answers
      # every reviewed action; anything but allow is re-judged on the same
      # prompt. Both stages run one model so the judge's prompt is a cache hit
      # (Claude Code and Codex gate on one model too); `none` because 5.6 has
      # no `minimal` (pi-ai sends `low` for it). Terra over Luna: injection evals.
      classifier_filter:
        model: gpt-5.6-terra
        reasoning_effort: none
      classifier_judge:
        model: gpt-5.6-terra
        reasoning_effort: medium
    sensitive_subpaths:
      - "agent/auth.json"
      - "agent/sessions"
      - "agent/settings.json"
      - "agent/models.json"
      - "agent/mcp.json"
      - "agent/mcp-oauth"
    extras:
      allowed_domains:
        - "openai.com"
        - "*.openai.com"
        - "chatgpt.com"
        - "*.chatgpt.com"
        # version/update checks and install ping
        - "pi.dev"
# shared subagent definitions rendered for every harness; bodies live in
# .chezmoitemplates/subagents/<name>.md, tier resolves via subagent_tiers.
# `tools` binds only the Claude render — subagent-codex.toml emits no tool
# list, just a read-only permission flag from `readonly`
subagents:
  # Explore (Claude) / explorer (Codex) override each harness's built-in role
  # so managed routine exploration stays on the configured small tier.
  # explore-deep handles broad/cross-subsystem sweeps. Names differ because
  # the built-ins do: Claude's is `Explore`, Codex's is `explorer`.
  Explore: &explore
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only code exploration scoped to a single symbol, file, or known area — locate a definition, find callers, trace one flow. Returns distilled findings (paths, file:line), not raw file dumps. Do NOT use for sweeps spanning multiple files or subsystems — dispatch explore-deep for those. Reads local code only — it has no web access, so upstream changelogs and release notes go to dep-researcher."
  explorer: *explore
  explore-deep:
    tier: mid
    reasoning_effort: medium
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Read-only exploration for a sweep spanning multiple files or subsystems, tracing a flow across module boundaries, or cross-file reasoning — any exploration broad enough you'd otherwise finish it by reading several files yourself. Returns distilled findings (paths, file:line), not raw file dumps. Prefer this over the single-symbol explorer whenever scope is broad or unknown."
  go-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Go code diffs for correctness and idiomatic style before merging."
  python-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Python diffs for correctness, type safety, and idiomatic style before merging."
  ts-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review TS/JS (TypeScript/Node.js) diffs for type safety, async correctness, and idiomatic patterns."
  shell-reviewer:
    # mid, not small: shell/template review is judgment work, where the small
    # tier's documented failure mode (flailing, fabrication) lives
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review shell/dotfile diffs — shell scripts, zsh configs, chezmoi templates — for correctness and safety."
  infra-reviewer:
    # the third high-volume stack after go and ts, and the one diff-reviewer's
    # "no language preset" cannot cover: chart/CRD/GitOps hazards are not
    # inferable from surrounding manifests
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review Kubernetes/Helm/ArgoCD manifest diffs — chart values, CRDs, GitOps app definitions — for correctness and upgrade safety before merging."
  diff-reviewer:
    tier: mid
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Review a changed diff through one assigned lens (correctness, simplify, or tests) in any language without a dedicated reviewer; read-only, cites changed hunks. Dispatched per file group by the ship-check skill. Judges the changed lines, not the requirements behind them — a conformance pass over requirements-plus-artifact goes to spec-reviewer."
  # Fresh-eyes conformance pass: unlike a diff-lens reviewer, this role checks
  # the finished artifact for omissions against its requirements.
  spec-reviewer:
    # the `self_review` rule names this agent; the projection reads the name
    # from here so a rename cannot leave the always-loaded line pointing at a
    # role that no longer exists. Exactly one subagent carries this flag.
    self_review: true
    # top, not inherit: the driver is the frontier tier and no child runs it.
    # The reviewer only proposes; evidence and the open catch-count trigger are
    # in the audit log (2026-09-15).
    tier: top
    reasoning_effort: high
    readonly: true
    tools: "Read, Grep, Glob, Bash"
    description: "Judge one finished artifact against the requirements it was built from, in one pass — dispatched for the fresh-eyes self-review before work is called done, not for ordinary diff review. Reports requirements that went unimplemented as readily as defects in what was written; read-only. Reviewing the changed lines under one lens is diff-reviewer's job."
  log-triager:
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Bash"
    description: "Summarize large log files or stderr dumps into a short diagnosis instead of pasting them into the main context."
  dep-researcher:
    # no Bash: agent_sandbox.network allowlists 16 hosts, and upstream release
    # notes are not among them — WebFetch/WebSearch are harness tools and reach
    # them, a curl would fail confusingly.
    tier: small
    reasoning_effort: low
    readonly: true
    tools: "Read, Grep, Glob, WebSearch, WebFetch, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Research one dependency bump — upstream changelog, breaking changes, migration steps, changed defaults. Dispatched per dependency by the dep-audit skill; returns findings only, never touches the repo."
  researcher:
    # Dedicated web/docs research preset; no Bash for the same reason as
    # dep-researcher.
    tier: mid
    reasoning_effort: medium
    readonly: true
    tools: "Read, Grep, Glob, WebSearch, WebFetch, mcp__exa__web_search_exa, mcp__exa__web_fetch_exa, mcp__context7__resolve-library-id, mcp__context7__query-docs"
    description: "Answer one bounded research question from the web and library docs — practitioner practice, vendor guidance, a library's documented behaviour — and return sourced findings with URL, date and evidence quality. Not for code exploration (explore-*) or a dependency bump (dep-researcher); never edits."
  implementer:
    # the only write-capable entry: executor for settled-design leaf work. Mid,
    # not small — small-tier executors regress on anything needing judgment,
    # and a failed attempt round-trips back through the expensive parent context.
    # One writer, not a second top-tier one (decision 2026-09-21): add that
    # only on the override/round-trip trigger in the audit log.
    tier: mid
    reasoning_effort: medium
    readonly: false
    tools: "Read, Grep, Glob, Bash, Edit, Write"
    description: "Implement one bounded slice of a settled design — pattern-repeat edits and spec'd fixes through substantive implementation inside owned files — against explicit acceptance criteria and a verification command. Works out the how within its scope; makes no design, API, or cross-scope decisions and stops to report when one surfaces. NOT for exploratory work or an unsettled design; never commits."
  # pi only (no per-harness file renders elsewhere): Claude Code and Codex
  # ship an equivalent built-in. Mirrors Claude's general-purpose agent — every
  # tool and the only role that may launch children; the specialists stay leaf
  # roles. Top, not inherit: the parent is the frontier tier and no child runs
  # it (Claude config supplies the same fallback via CLAUDE_CODE_SUBAGENT_MODEL).
  general-purpose:
    tier: top
    reasoning_effort: high
    readonly: false
    nests: true
    tools: "Read, Grep, Glob, Bash, Edit, Write, WebSearch, WebFetch, mcp__*"
    description: "Catch-all for multi-step work that fits no specialist — research plus implementation, or a task that needs its own delegation. Runs the top worker tier; prefer a specialist when one fits."
# explicit model IDs, not aliases: aliases re-resolve across CLI releases and can
# silently land on another tier; the audit skill live-probes these pins.
# `frontier` is the driver's tier (agents.<harness>.defaults.model), never a
# child's: every harness holds children at `top` or below and no entry uses `inherit`.
subagent_tiers:
  claude:
    small: claude-haiku-4-5
    mid: claude-sonnet-5
    top: claude-opus-5
    # Keep in lockstep with agents.claude.defaults.model.
    frontier: claude-fable-5-1
  codex: &openai_subagent_tiers
    small: gpt-5.6-luna
    mid: gpt-5.6-terra
    # anchored: the Claude->Codex review/advice bridge pins this tier
    top: &openai_top gpt-5.6-sol
    frontier: gpt-6-astra
  pi: *openai_subagent_tiers
agent_sandbox:
  filesystem:
    paths:
      ".env": none
      "~/.aws": none
      "~/.netrc": none
      "~/.git-credentials": none
      "~/.npmrc": none
      "~/.ssh": none
      "~/.gnupg": none
      "~/.vault-token": none
      "~/.azure": none
      "~/.kube": none
      "~/.docker": none
      "~/.mc": none
      "~/.talos": none
      "~/.config/1Password": none
      "~/.config/op": none
      "~/.config/gcloud": none
      "~/.config/opentofu": none
      "~/.config/configstore": none
      "~/.local/share/uv/credentials": none
      "~/.claude.json": none
      "~/.zsh_history": none
      "~/.zhistory": none
      "~/.go/bin": read
      "~/.go/pkg/mod": write
      "~/.npm/_cacache": write
      "~/.npm/_logs": write
      "~/.cache/uv": write
    # per-OS paths merged on the matching .chezmoi.os (override base modes); others skipped
    os_paths:
      darwin:
        "/opt/homebrew": read
        # uv's cache lives under Library/Caches on macOS, not ~/.cache/uv
        "~/Library/Caches/uv": write
    resolved_paths:
      # path resolved at chezmoi render time; skipped if `requires` binary absent
      - mode: write
        requires: go
        command: "go env GOCACHE"
  network:
    allow_local_binding: true
    allowed_domains:
      - github.com
      - "*.github.com"
      - githubusercontent.com
      - "*.githubusercontent.com"
      - registry.npmjs.org
      - npmjs.org
      - "*.npmjs.org"
      - pypi.org
      - files.pythonhosted.org
      - proxy.golang.org
      - sum.golang.org
      - pkg.go.dev
      - developer.mozilla.org
      - stackoverflow.com
      - stackexchange.com
      - "*.stackexchange.com"
      - nodejs.org
      - context7.com
      - "*.context7.com"
agent_mcp_servers:
  # Explicit shared trust: Claude emits an allow rule and Codex emits
  # default_tools_approval_mode = "approve"; omission keeps normal review.

  # scoped to claude: codex must not be handed itself as an MCP server; skipped
  # on machines without the codex binary. The bridge wraps the stable
  # `codex exec` CLI because `codex mcp-server` is deprecated (v0.149.1);
  # MCP transport keeps what a Bash call can't — harness-spawned outside the
  # sandbox (~/.codex deny intact) and prompt-free in plan mode (harness.md).
  codex:
    script: codex-bridge.mjs
    # Anchored to defaults.model_reasoning_effort and subagent_tiers.codex.top:
    # review and advice are worker roles, so the bridge runs the top worker tier
    # while interactive Codex drives on the frontier (rationale: harness.md).
    args: ["--reasoning-effort", *codex_reasoning_effort, "--model", *openai_top]
    auto_approve_tools: true
    requires: codex
    harnesses:
      - claude
  context7:
    package_bin: context7-mcp
    direct_tools: true
    args: []
    auto_approve_tools: true
    readonly_tools: [resolve-library-id, query-docs]
    env:
      CONTEXT7_API_KEY:
        op: Personal/Context7/api key
  exa:
    package_bin: exa-mcp-server
    direct_tools: false
    args: []
    auto_approve_tools: true
    # web_fetch_exa is 3.4.x's fetch tool; crawling_exa is its legacy name and
    # stays listed while the build still carries it
    readonly_tools: [web_search_exa, web_fetch_exa, get_code_context_exa, company_research_exa, crawling_exa]
    # 3.4.1 added Exa-side agent orchestration: these dispatch and bill remote
    # agentic runs, a wider grant than the search/fetch tools blanket approval
    # was given for.
    denied_tools:
      - deep_researcher_start
      - deep_researcher_check
      - agent_run
      - agent_create_run
      - agent_get_run
      - agent_wait_for_run
      - agent_cancel_run
    env:
      EXA_API_KEY:
        op: Personal/Exa/api key
  playwright:
    readonly_tools: [browser_navigate, browser_navigate_back, browser_snapshot, browser_tabs, browser_wait_for]
    package_bin: playwright-mcp
    # deliberately NOT auto_approve_tools: tools taking a caller-chosen filename
    # (snapshot, take_screenshot, evaluate, console_messages, network_request/s)
    # write through a purely lexical workspace check (no realpath), so a
    # workspace symlink reaches any user-writable path; upstream says to rely on
    # client-level permissions, and the server runs outside the bash sandbox.
    denied_tools:
      # denied outright rather than left to the prompt: never legitimate here.
      # Executes arbitrary JS in the Playwright *server* process
      # (RCE-equivalent, per its own tool description).
      - browser_run_code_unsafe
      # both take `paths` and hand file contents to a page — the same lexical
      # check, so the same symlink walk, in the exfiltration direction
      - browser_file_upload
      - browser_drop
    args:
      - --browser
      - chromium
      - --headless
      - --isolated
