# oMLX has no declarative model management of its own — no download subcommand,
# no preload list in settings.json, only an authenticated admin route — so
# run_onchange_after_omlx-models.sh reconciles ~/.omlx/models against this file:
# it fetches what is missing, removes what is not listed, and merges each
# entry's `settings` into ~/.omlx/model_settings.json without disturbing the
# per-model keys the server writes at runtime.
#
# `dir` defaults to the repo owner; a `convert` block means self-quantize from
# the source weights instead of downloading a prebuilt MLX build; `revision`
# pins a prebuilt download (not a `convert`) to a commit. `settings` is merged
# recursively over the server's entry for the model; is_pinned, is_hidden and
# is_default default to false, so dropping one here resets it. Any other key,
# once merged, persists until removed in the admin UI or by hand.
omlx:
  models:
    # `id` is the served model id: omlx registers a model under its leaf
    # directory name, not its repo name. Renaming it means editing
    # dot_config/nvim/lua/plugins/editor/minuet-ai.lua, which requests it by name.
    - id: Mellum2-12B-A2.5B-Base-4bit
      repo: JetBrains/Mellum2-12B-A2.5B-Base
      # Held at the historical mlx-community segment (not a real repo) because
      # moving this model would re-convert 24GB for nothing.
      dir: mlx-community
      # No public 4bit MLX build of Mellum2-Base exists, so it is self-quantized
      # from the bf16 weights with omlx's bundled mlx-lm (stock pip mlx-lm lacks
      # the mellum arch). The arch's built-in quant_predicate bumps the MoE router
      # gates to 8bit, so plain 4bit/group-64 reproduces the model exactly.
      convert:
        bits: 4
        group_size: 64
      # pinned: preloaded at startup, as minuet fires on nearly every keystroke.
      # hidden: left out of /v1/models so the admin chat picker doesn't offer
      # it; minuet requests it by name, which ignores is_hidden.
      settings:
        is_pinned: true
        is_hidden: true

    # Abliterated build with vision kept; the default model for oMLX's
    # /admin/chat. Left unpinned so it loads on demand rather than holding 16GB
    # resident. Revision pinned because it is a third-party upload.
    - id: Qwen3.8-27B-heretic-VL-MLX-4bit
      repo: donedynamics/Qwen3.8-27B-heretic-VL-MLX-4bit
      revision: cd4c5aa4e21679d0a4ea5d2bec609b7e72acacb9
      settings:
        is_default: true
        chat_template_kwargs:
          # its chat template defaults to xhigh
          reasoning_effort: medium
